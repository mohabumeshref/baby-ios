# XcodeGen spec - the .xcodeproj is generated from this file, never hand-edited.
#
# Why: this project is authored on Windows where Xcode cannot run, so a
# hand-written project.pbxproj could not be validated before CI. A declarative
# spec removes that whole class of failure and stays reviewable in diffs.
#
# Regenerate locally (macOS):  brew install xcodegen && xcodegen generate
# CI does this automatically before every build.

name: BabyTracker

options:
  bundleIdPrefix: com.wecare
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: ar
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    # Must match the App ID in the Apple Developer portal, the provisioning
    # profile, and the iOS app registered in the Firebase project.
    PRODUCT_BUNDLE_IDENTIFIER: com.wecare.arabicbaby
    DEVELOPMENT_TEAM: 78CLZ67RBG   # same team as pt-ios; confirm
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"   # testflight.yml overwrites via agvtool
    SWIFT_VERSION: "5.9"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    # Arabic is the development language; the app is RTL-first.
    SWIFT_EMIT_LOC_STRINGS: YES

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    # Pinned to 11.x deliberately. Firestore's Codable support (data(as:),
    # setData(from:)) shipped as a separate FirebaseFirestoreSwift product in
    # 10.x - which pt-ios imports - and was folded into FirebaseFirestore in
    # 11.x. Spanning both majors would make the correct import ambiguous.
    minVersion: "11.0.0"
    maxVersion: "12.0.0"
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    minVersion: "11.11.0"
    maxVersion: "12.0.0"

targets:
  BabyTracker:
    type: application
    platform: iOS
    sources:
      - path: BabyTracker
        excludes:
          - "**/.DS_Store"
          # Referenced via INFOPLIST_FILE; including it as a source too makes
          # it a bundled resource as well.
          - "Info.plist"
      # ForumKit is compiled into the app rather than being its own framework
      # target - see the note at the bottom of this file.
      - path: ForumKit
        excludes:
          - "**/.DS_Store"
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseMessaging
      - package: Firebase
        product: FirebaseStorage
      - package: Firebase
        product: FirebaseAnalytics
      - package: Firebase
        product: FirebaseRemoteConfig
      - package: GoogleMobileAds
        product: GoogleMobileAds
    settings:
      base:
        INFOPLIST_FILE: BabyTracker/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"   # iPhone only, matching the Android app's scope

  BabyTrackerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - BabyTrackerTests
    dependencies:
      - target: BabyTracker
    settings:
      base:
        # Must not inherit the app's bundle id from the project-level setting.
        PRODUCT_BUNDLE_IDENTIFIER: com.wecare.arabicbaby.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  BabyTracker:
    build:
      targets:
        BabyTracker: all
    test:
      targets:
        - BabyTrackerTests
    run:
      config: Debug
    archive:
      config: Release

# ─────────────────────────────────────────────────────────────────────────────
# Why ForumKit is not its own target
#
# It was one, briefly. A dynamic framework target that links Firebase forces
# SPM to build Firebase's products as dynamic frameworks too (they ship static
# by default), and dynamic FirebaseFirestore fails to link on arm64 - it can't
# resolve the gRPC/absl C++ symbols, and FirebaseCore loses its dependency on
# FirebaseCoreInternal. CI run #1 died exactly there.
#
# pt-ios is the counter-example that works: one app target, Firebase linked
# statically, shipping. So ForumKit is compiled into the app instead.
#
# The directory and its `public` API are kept deliberately. Nothing in
# ForumKit/ may import app code, so lifting it into a real Swift package stays
# a mechanical move once someone can iterate in Xcode - and a package would
# not hit this, since SPM resolves static linkage differently than a framework
# target does.
# ─────────────────────────────────────────────────────────────────────────────
