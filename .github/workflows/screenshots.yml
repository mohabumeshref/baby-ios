# Boots a simulator, launches the app in Arabic, and captures screenshots as
# build artifacts.
#
# This exists because the app is authored on Windows: it is the only way for
# the author to actually see the rendered UI - RTL layout, Cairo text, and the
# Warm & Refined palette - before it reaches a device.
#
# Kept separate from ci.yml so a flaky simulator boot can never block a
# compile check.
name: Screenshots

# MANUAL ONLY. This was originally set to run on any push touching Views/ or
# DesignSystem/, which on 10x-billed macOS runners would have quietly charged
# for a full build plus a simulator boot on most UI commits. Run it when a
# screenshot is actually wanted.
on:
  workflow_dispatch:
    inputs:
      language:
        description: 'UI language to launch in'
        required: false
        default: 'ar'
        type: choice
        options: [ar, en]

env:
  PROJECT: BabyTracker.xcodeproj
  SCHEME: BabyTracker
  BUNDLE_ID: com.wecare.arabicbaby

jobs:
  screenshots:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'

      # Without the real plist the app runs with Firebase disabled and the
      # community tab can only ever show the signed-out screen. Optional: if the
      # secret is absent the job still works, it just can't show the forum.
      - name: Restore GoogleService-Info.plist
        env:
          PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          if [ -n "$PLIST_BASE64" ]; then
            echo -n "$PLIST_BASE64" | base64 --decode -o BabyTracker/GoogleService-Info.plist
            echo "Firebase enabled for this run"
          else
            echo "::warning::No plist secret - the forum will render signed-out"
          fi

      - name: Generate Xcode project
        run: |
          brew install --quiet xcodegen
          xcodegen generate

      # Resolved by UDID rather than a hardcoded name - runner images retire
      # device names between Xcode releases.
      - name: Select simulator
        id: sim
        run: |
          # The App Store iPhone slot is 6.9" (1320x2868). Taking the first
          # available iPhone gave a 6.3" Pro, whose 1206x2622 output Apple
          # will not accept there, so pin a Pro Max.
          pick () {
            xcrun simctl list devices available \
              | grep -E "^[[:space:]]+$1" \
              | head -1 \
              | grep -oE "[0-9A-Fa-f]{8}-[0-9A-Fa-f-]{27}"
          }

          # if/then, not `[ -z x ] && y`: this step runs under `bash -e`, and a
          # test that lands false is itself a failing command when it is last
          # in the chain - so finding the device on the first try would abort
          # the job.
          UDID=$(pick "iPhone 16 Pro Max")
          if [ -z "$UDID" ]; then UDID=$(pick "iPhone .* Pro Max"); fi
          if [ -z "$UDID" ]; then UDID=$(pick "iPhone"); fi

          if [ -z "$UDID" ]; then
            echo "::error::No iPhone simulator on this image"
            xcrun simctl list devices available
            exit 1
          fi

          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Using $(xcrun simctl list devices available | grep "$UDID" | sed -E 's/^ *//')"

      - name: Build for simulator
        run: |
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/spm" \
            CODE_SIGNING_ALLOWED=NO

      - name: Boot simulator and install
        run: |
          UDID="${{ steps.sim.outputs.udid }}"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          APP_PATH=$(find "$RUNNER_TEMP/dd/Build/Products" -name "BabyTracker.app" -type d | head -1)
          echo "Installing $APP_PATH"
          xcrun simctl install "$UDID" "$APP_PATH"

      - name: Launch and capture
        run: |
          LANG_CODE="${{ github.event.inputs.language || 'ar' }}"
          UDID="${{ steps.sim.outputs.udid }}"
          mkdir -p "$RUNNER_TEMP/shots"

          # -seed_demo 1 is store-screenshot mode: sample forum posts instead
          # of the live feed, no ad banner, no ATT sheet. Sample posts matter
          # for privacy as much as for looks - the real feed is other parents'
          # personal writing, which does not belong in marketing material.
          #
          # (What was here before built an AUTH_ARGS string to sign into the
          # live forum and then never passed it to the launch, so the community
          # capture had always been a sign-in screen.)

          # The job can't tap the UI, so each screen is a separate launch
          # driven by the DEBUG-only launch arguments in ScreenshotSeed.swift:
          # seed a 90-day-old baby to skip onboarding, and pick the tab.
          capture () {
            local name="$1" tab="$2" days="$3"
            xcrun simctl terminate "$UDID" "$BUNDLE_ID" 2>/dev/null || true
            xcrun simctl launch "$UDID" "$BUNDLE_ID" \
              -AppleLanguages "($LANG_CODE)" \
              -AppleLocale "${LANG_CODE}_JO" \
              -seed_demo 1 \
              -seed_baby_days_ago "$days" \
              -seed_tab "$tab"
            sleep 6
            xcrun simctl io "$UDID" screenshot "$RUNNER_TEMP/shots/${name}-${LANG_CODE}.png"
            echo "captured ${name}"
          }

          capture 01-home     0 90
          capture 02-weeks    1 90
          capture 03-community 2 90 18

          # Onboarding has no seeded date, so it renders the first-run screen.
          xcrun simctl terminate "$UDID" "$BUNDLE_ID" 2>/dev/null || true
          xcrun simctl launch "$UDID" "$BUNDLE_ID" \
            -AppleLanguages "($LANG_CODE)" -AppleLocale "${LANG_CODE}_JO" \
            -seed_demo 1
          sleep 6
          xcrun simctl io "$UDID" screenshot "$RUNNER_TEMP/shots/00-onboarding-${LANG_CODE}.png"

          echo "Captured:"
          ls -la "$RUNNER_TEMP/shots"
          for f in "$RUNNER_TEMP/shots"/*.png; do
            printf '%s: ' "$(basename "$f")"
            sips -g pixelWidth -g pixelHeight "$f" | awk '/pixel/ {printf "%s ", $2}'
            echo
          done

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ github.event.inputs.language || 'ar' }}-${{ github.run_number }}
          path: ${{ runner.temp }}/shots/*.png
          if-no-files-found: error
