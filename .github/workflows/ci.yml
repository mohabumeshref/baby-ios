# Compile + test check.
#
# COST: macOS runners bill at 10x the Linux rate, so this workflow is written
# to be cheap rather than thorough:
#
#   * ONE job, not two. A separate test job would repeat checkout, Xcode
#     selection, xcodegen install and SPM resolution - several minutes of
#     billed time to re-do work the build job already did.
#   * ONE xcodebuild invocation. `xcodebuild test` builds everything it needs,
#     so a preceding `build` step is pure duplication.
#   * Failures are diagnosed from a SAVED LOG, never by re-running the build.
#   * Simulator only. The runners are Apple Silicon, so a simulator build is
#     already arm64 and catches the same architecture and linker problems a
#     device build would. testflight.yml does the real device archive.
#   * `cancel-in-progress` so a quick follow-up push doesn't pay for both.
#
# Before adding a step here, check it can't be folded into the existing run.
name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT: BabyTracker.xcodeproj
  SCHEME: BabyTracker

jobs:
  build-and-test:
    runs-on: macos-latest
    timeout-minutes: 30   # hard stop so a hung run can't drain the budget

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'

      - name: Generate Xcode project
        run: |
          # Direct binary download - `brew install xcodegen` pulls a large
          # dependency tree and costs about a minute of billed time per run.
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install --quiet xcodegen
          fi
          xcodegen generate

      - name: Cache SPM
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/spm
          key: spm-${{ runner.os }}-${{ hashFiles('project.yml') }}
          restore-keys: spm-${{ runner.os }}-

      # Resolve a simulator by UDID instead of hardcoding a device name.
      # Runner images retire device names without warning - "iPhone 16" vanished
      # under Xcode 26.3 - and each such break costs a full billed run to
      # discover. Whatever iPhone the image ships with will do.
      - name: Select simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available \
                 | grep -E "^[[:space:]]+iPhone" \
                 | head -1 \
                 | grep -oE "[0-9A-Fa-f]{8}-[0-9A-Fa-f-]{27}")

          if [ -z "$UDID" ]; then
            echo "::error::No iPhone simulator on this image"
            xcrun simctl list devices available
            exit 1
          fi

          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Using $(xcrun simctl list devices available | grep "$UDID" | sed -E 's/^ *//')"

      # Builds AND tests in a single pass. Output is teed to a log so the
      # failure step below can read it instead of paying to rebuild.
      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/spm" \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee "$RUNNER_TEMP/xcodebuild.log"

      - name: Diagnostics
        if: failure()
        run: |
          echo "::group::Compiler errors"
          grep -E "error:" "$RUNNER_TEMP/xcodebuild.log" | sort -u | head -40 || true
          echo "::endgroup::"

          echo "::group::Test failures"
          grep -E "XCTAssert|failed \(|Test Case .* failed" "$RUNNER_TEMP/xcodebuild.log" \
            | head -40 || true
          echo "::endgroup::"

          echo "::group::Linker"
          grep -E "Undefined symbols|ld: |symbol\(s\) not found" "$RUNNER_TEMP/xcodebuild.log" \
            | head -20 || true
          echo "::endgroup::"

      # Kept only on failure, and only the tail - the full log is large.
      - name: Upload log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: ${{ runner.temp }}/xcodebuild.log
          retention-days: 3
