# Fast compile check. Runs on every branch and PR, no secrets, no signing,
# no upload. This is the feedback loop during development - testflight.yml is
# only for releases.
name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT: BabyTracker.xcodeproj
  SCHEME: BabyTracker

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Cache SPM
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/spm
          key: spm-${{ runner.os }}-${{ hashFiles('project.yml') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Resolve Swift Package dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/spm"

      - name: Build
        run: |
          set -o pipefail
          # xcpretty is not guaranteed to be on the runner image, and piping
          # into a missing binary would fail the step even on a good build.
          # Fall back to raw xcodebuild output rather than pretending to fail.
          if command -v xcpretty >/dev/null 2>&1; then
            FORMATTER="xcpretty"
          else
            FORMATTER="cat"
          fi

          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/spm" \
            CODE_SIGNING_ALLOWED=NO \
            | $FORMATTER

      # Surfaces the actual compiler diagnostics when the pretty formatter
      # swallowed them.
      - name: Show errors
        if: failure()
        run: |
          echo "::group::Build errors"
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/spm" \
            CODE_SIGNING_ALLOWED=NO 2>&1 \
            | grep -E "error:|warning:|note:" | head -60 || true
          echo "::endgroup::"

  # Separate job: a compiling app is not a correct one. These are the only
  # automated check on the ported logic - the age arithmetic and, critically,
  # the search tokenizer, which must stay byte-identical to the Android app or
  # posts silently stop matching across the shared forum.
  test:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Cache SPM
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/spm
          key: spm-${{ runner.os }}-${{ hashFiles('project.yml') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Run tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/spm" \
            CODE_SIGNING_ALLOWED=NO

      - name: Show test failures
        if: failure()
        run: |
          echo "::group::Failures"
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/spm" \
            CODE_SIGNING_ALLOWED=NO 2>&1 \
            | grep -E "error:|failed|XCTAssert" | head -60 || true
          echo "::endgroup::"
